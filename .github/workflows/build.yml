name: casper-android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  iso-compat:
    name: Base image is 32-bit-UEFI compatible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the reference Android-x86 ISO
        run: |
          set -e
          # Pinned to an exact release with a known SHA1. If this ever stops
          # matching, the file changed and the compatibility result below is
          # meaningless — fail loudly rather than testing a different image.
          URL="https://downloads.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso"
          expected=1cc85b5ed7c830ff71aecf8405c7281a9c995aa0
          for i in 1 2 3 4 5; do
            curl -sL -C - --retry 3 --max-time 600 -o ax86.iso "$URL" && break
            echo "retry $i"
          done
          got=$(sha1sum ax86.iso | cut -d' ' -f1)
          echo "sha1: $got"
          [ "$got" = "$expected" ] || { echo "::error::ISO sha1 mismatch (got $got want $expected)"; exit 1; }
          # Keep it for the boot test in the other job.
          du -h ax86.iso

      - name: Check 32-bit UEFI compatibility
        run: ./test/check-iso.sh ax86.iso

      - name: Boot the ISO under 32-bit OVMF (the real go/no-go)
        run: |
          set -e
          sudo apt-get update -qq
          # ovmf-ia32 is a separate package on Debian/Ubuntu; the plain `ovmf`
          # package ships only x86-64 firmware, which would make this test
          # prove nothing about the tablet's IA32 firmware.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 socat ovmf ovmf-ia32 || \
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 socat ovmf
          # Patch a COPY: the original stays pristine so check-iso.sh results
          # keep describing the real upstream ISO. The patch auto-boots and adds
          # console=ttyS0, which is the only way to get kernel evidence.
          python3 test/patch-iso-serial.py ax86.iso ax86-serial.iso
          ./test/boot-iso-qemu.sh --iso ax86-serial.iso --out /tmp/iso-boot --wait 180

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-boot-evidence
          path: |
            /tmp/iso-boot/*.ppm
            /tmp/iso-boot/serial.log
            /tmp/iso-boot/qemu.log
          if-no-files-found: warn

  image:
    name: Trimmed flashable image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          # Debian/Ubuntu mirrors intermittently return "Could not wait for
          # server fd" on the hosted runners; retry with backoff rather than
          # failing an otherwise fine build on a transient network error.
          set -e
          sudo apt-get update -qq -o Acquire::Retries=5 || sudo apt-get update -qq
          for attempt in 1 2 3; do
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                 -o Acquire::Retries=5 \
                 squashfs-tools xorriso isolinux syslinux-utils mtools; then
              echo "tooling installed on attempt $attempt"
              break
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 20))
            [ "$attempt" = 3 ] && { echo "::error::could not install tooling"; exit 1; }
          done
          for t in unsquashfs mksquashfs xorriso; do
            command -v "$t" >/dev/null || { echo "::error::$t missing after install"; exit 1; }
          done

      - name: Fetch the reference ISO
        run: |
          set -e
          URL="https://downloads.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso"
          for i in 1 2 3 4 5; do
            curl -sL -C - --retry 3 --max-time 900 -o ax86.iso "$URL" && break
            echo "retry $i"
          done
          got=$(sha1sum ax86.iso | cut -d' ' -f1)
          [ "$got" = "1cc85b5ed7c830ff71aecf8405c7281a9c995aa0" ] \
            || { echo "::error::ISO sha1 mismatch: $got"; exit 1; }
          echo "ISO verified"

      - name: Build the trimmed image
        run: |
          # Stripping happens inside system.img, which must be loop-mounted,
          # so this needs root.
          sudo ./image/build-image.sh --iso ax86.iso --out casper-android.iso \
            --work /tmp/imgwork

      - name: Verify the result is still 32-bit-UEFI bootable
        run: |
          # The whole point of trimming is a lighter image. If the strip broke
          # the boot chain, that is worse than shipping nothing, so re-run the
          # hardware-compatibility checks on the OUTPUT.
          ./test/check-iso.sh casper-android.iso

      - name: Boot the trimmed image under 32-bit UEFI
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 socat ovmf ovmf-ia32 || \
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 socat ovmf
          ./test/boot-iso-qemu.sh --iso casper-android.iso \
            --out /tmp/trim-boot --wait 240

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casper-android-image
          path: |
            casper-android.iso
            /tmp/trim-boot/*.ppm
            /tmp/trim-boot/serial.log
          if-no-files-found: warn

  shell:
    name: Desktop shell APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the preinstalled Android SDK
        run: |
          # GitHub's ubuntu-latest runner ships the Android SDK at
          # $ANDROID_SDK_ROOT. Do not use android-actions/setup-android: it
          # currently fails with "Failed to find package 'tools'" and takes the
          # whole job down. The SDK is already there; just locate and report it.
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::no Android SDK at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDK at $SDK"
          ls "$SDK/build-tools" || true
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          test -n "$BT" || { echo "::error::no build-tools installed"; exit 1; }
          ls "$SDK/platforms" || true

      - name: Build the shell APK
        run: |
          # aapt2/d8/zipalign/apksigner all come from the SDK; the repo's
          # build script prefers the native binaries on x86_64 runners.
          ./shell/build.sh

      - name: Verify the APK is a valid HOME activity
        run: |
          set -e
          APK=shell/build/casper-desktop.apk
          test -f "$APK"
          # A desktop shell must declare CATEGORY_HOME, or it can never replace
          # the launcher and the whole project premise fails on device.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml \
            | grep -q 'android.intent.category.HOME' \
            || { echo "::error::APK does not declare CATEGORY_HOME"; exit 1; }
          "$BT/apksigner" verify "$APK"
          echo "APK OK: $(stat -c %s "$APK") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: casper-desktop-apk
          path: shell/build/casper-desktop.apk

  kernel-config:
    name: Kernel config (symbols resolve in 6.12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev xz-utils \
            dwarves cpio python3 rsync gcc-13 gcc-multilib
          # The runner's default GCC is 15+, which defaults to C23. In C23
          # `bool`, `true` and `false` are keywords, and Linux 6.12's freestanding
          # EFI stub (which CONFIG_EFI_MIXED requires) defines them as enum
          # constants and a typedef — so it fails with
          #   "cannot use keyword 'false' as enumeration constant".
          # That stub is mandatory here: without it IA32 firmware cannot enter
          # this kernel at all. Pin to GCC 13 (defaults to gnu17) rather than
          # patching upstream headers, which would be a maintenance trap.
          gcc-13 --version | head -1

      - name: Fetch kernel source
        run: |
          set -e
          KVER=6.12
          SERIES=6
          curl -fL --retry 3 -o "linux-$KVER.tar.xz" \
            "https://cdn.kernel.org/pub/linux/kernel/v$SERIES.x/linux-$KVER.tar.xz"
          tar -xf "linux-$KVER.tar.xz"
          echo "KVER=$KVER" >> "$GITHUB_ENV"

      - name: Merge config fragment and resolve
        run: |
          set -e
          cd "linux-$KVER"
          make ARCH=x86_64 defconfig
          ../kernel/merge-config.sh .config ../kernel/casper-android.fragment > .config.merged
          mv .config.merged .config
          # olddefconfig is the real test: it resolves dependencies and will
          # drop any symbol whose deps cannot be met. A fragment that "looks
          # fine" but silently loses binder fails here, not on the tablet.
          make ARCH=x86_64 olddefconfig

      - name: Assert every required symbol survived resolution
        run: |
          set -e
          cd "linux-$KVER"
          FAIL=0
          req() {
            if grep -qE "^$2=" .config; then
              echo "OK   $2=$3"
            else
              echo "::error::$2 did not resolve (wanted $3)"
              FAIL=1
            fi
          }
          # These are the ones whose silent absence makes the device unbootable
          # or silent, and whose absence is hard to attribute after the fact.
          grep -qE '^CONFIG_ANDROID_BINDER_IPC=y$' .config || { echo "::error::binder missing"; FAIL=1; }
          grep -qE '^CONFIG_ANDROID_BINDERFS=y$' .config   || { echo "::error::binderfs missing"; FAIL=1; }
          grep -qE '^CONFIG_PSI=y$' .config                || { echo "::error::PSI missing (lmkd degrades)"; FAIL=1; }
          grep -qE '^CONFIG_EFI_MIXED=y$' .config          || { echo "::error::EFI_MIXED missing (32-bit UEFI cannot boot this kernel)"; FAIL=1; }
          grep -qE '^CONFIG_ZRAM=y$' .config               || { echo "::error::zram missing"; FAIL=1; }
          grep -qE '^CONFIG_SECURITY_SELINUX=y$' .config   || { echo "::error::SELinux missing"; FAIL=1; }
          grep -qE '^CONFIG_SND_SOC_INTEL_BYTCR_RT5640_MACH=y$' .config \
            || { echo "::error::RT5640 audio machine driver missing (no sound on this tablet)"; FAIL=1; }
          # RTL8723BS is a module by necessity — its Kconfig has `depends on m`,
          # so it can never be =y. Asserting =y here would be unsatisfiable and
          # would fail for the wrong reason.
          grep -qE '^CONFIG_RTL8723BS=m$' .config          || { echo "::error::RTL8723BS Wi-Fi missing (must be =m)"; FAIL=1; }
          grep -qE '^CONFIG_CFG80211=m$' .config           || { echo "::error::CFG80211 missing (RTL8723BS needs it)"; FAIL=1; }
          grep -qE '^CONFIG_WLAN=y$' .config               || { echo "::error::WLAN missing"; FAIL=1; }
          grep -qE '^CONFIG_DRM_I915=y$' .config           || { echo "::error::i915 missing"; FAIL=1; }
          exit $FAIL

      - name: Build bzImage and modules
        run: |
          set -e
          cd "linux-$KVER"
          # RTL8723BS can only be built as a module, and module builds fail with
          # "No rule to make target 'debian/certs/...'" when the default config
          # expects distro signing keys that do not exist here. Disable module
          # signing explicitly rather than relying on the runner's toolchain.
          ./scripts/config --disable MODULE_SIG --disable DEBUG_INFO
          # The ubuntu-latest runner ships a GCC new enough that 6.12's ACPI
          # tables trip -Werror=unterminated-string-initialization, which is a
          # toolchain/upstream mismatch, not a config problem in this repo.
          # Relax only Werror; real errors still fail the build.
          ./scripts/config --disable WERROR
          make ARCH=x86_64 olddefconfig
          # Build with GCC 13: see the deps step for why the default GCC 15
          # cannot compile the EFI stub that EFI_MIXED depends on.
          make ARCH=x86_64 -j"$(nproc)" CC=gcc-13 HOSTCC=gcc-13 bzImage modules
          file arch/x86/boot/bzImage | tee /tmp/kernel-file.txt
          # bzImage is a boot executable, not an ELF, so `file` never says
          # "x86-64". Assert the properties that actually matter instead:
          #   - "64-bit EFI handoff entry point"  -> a 64-bit kernel
          #   - "32-bit EFI handoff entry point"  -> EFI_MIXED is compiled in,
          #     which is the ONLY way IA32 firmware can enter this kernel.
          # Earlier versions of this check grepped for "x86-64" and failed a
          # perfectly good kernel build.
          grep -q '64-bit EFI handoff entry point' /tmp/kernel-file.txt \
            || { echo "::error::bzImage has no 64-bit EFI handoff entry point"; exit 1; }
          grep -q '32-bit EFI handoff entry point' /tmp/kernel-file.txt \
            || { echo "::error::bzImage has no 32-bit EFI handoff entry — EFI_MIXED is not active, IA32 firmware cannot boot it"; exit 1; }
          echo "bzImage OK: 64-bit kernel with 32-bit EFI handoff (mixed mode)"
          # The Wi-Fi driver must exist as a module, since =y is impossible.
          # Its output file is r8723bs.ko — NOT rtl8723bs.ko. The Kconfig symbol
          # is RTL8723BS but the Makefile names the module r8723bs, and guessing
          # the filename from the symbol is how this check failed twice.
          find . -path '*rtl8723bs/r8723bs.ko' | head -3
          find . -path '*rtl8723bs/r8723bs.ko' | grep -q . \
            || { echo "::error::r8723bs.ko was not built (RTL8723BS Wi-Fi driver)"; exit 1; }
          ls -la "$(find . -path '*rtl8723bs/r8723bs.ko' | head -1)"
          # Mixed mode is what lets IA32 firmware enter this kernel. Confirm the
          # thunk is actually present in the built image, not just in .config.
          if command -v nm >/dev/null && [ -f vmlinux ]; then
            nm vmlinux | grep -qi 'efi_mixed' \
              && echo "efi_mixed thunk present" \
              || echo "::warning::efi_mixed symbol not found in vmlinux"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: casper-android-kernel
          path: |
            linux-6.12/arch/x86/boot/bzImage
            linux-6.12/.config
            linux-6.12/**/r8723bs.ko
